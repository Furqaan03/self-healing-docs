name: Doc Check
on:
  pull_request:
    paths:
      - "**/*.py"

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run self-healing docs check
        uses: ./action
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          confidence_threshold: "0.85"
